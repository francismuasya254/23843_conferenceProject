<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Student Technology and Innovation Conference</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">STIC 2026</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#about">About</a>
            <a href="index.html#details">Date &amp; Venue</a>
            <a href="index.html#fees">Fees</a>
            <a href="register.html" class="active">Register</a>
        </nav>
    </header>

    <main class="register-layout">
        <form id="registrationForm" class="form-card" action="process.php" method="POST" onsubmit="return validateForm()" novalidate>
            <h1>Register to attend</h1>

            <div class="field">
                <label for="fullName">Full name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Mary Wanjiku">
                <span class="error" id="fullNameError"></span>
            </div>

            <div class="field">
                <label for="admissionNo">Admission / registration number</label>
                <input type="text" id="admissionNo" name="admissionNo" placeholder="BIT/1234/2026">
                <span class="error" id="admissionNoError"></span>
            </div>

            <div class="row">
                <div class="field">
                    <label for="email">Email address</label>
                    <input type="text" id="email" name="email" placeholder="mary@example.com">
                    <span class="error" id="emailError"></span>
                </div>
                <div class="field">
                    <label for="phone">Phone number</label>
                    <input type="text" id="phone" name="phone" inputmode="numeric" maxlength="10" placeholder="0712345678" oninput="this.value = this.value.replace(/\D/g, '')">
                    <span class="error" id="phoneError"></span>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label for="year">Year of study</label>
                    <select id="year" name="year" onchange="calculateFee()">
                        <option value="1">Year 1</option>
                        <option value="2">Year 2</option>
                        <option value="3">Year 3</option>
                        <option value="4">Year 4 (final year)</option>
                    </select>
                </div>
                <div class="field">
                    <label for="days">Number of conference days (1 to 3)</label>
                    <input type="number" id="days" name="days" value="1" min="1" max="3" oninput="calculateFee()">
                    <span class="error" id="daysError"></span>
                </div>
            </div>

            <div class="field">
                <label for="category">Participation category</label>
                <select id="category" name="category" onchange="toggleWorkshop()">
                    <option value="">Choose a category</option>
                    <option value="conference">Conference Only</option>
                    <option value="workshop">Workshop Participant</option>
                </select>
                <span class="error" id="categoryError"></span>
            </div>

            <div class="field reveal" id="workshopBox" hidden>
                <label for="workshop">Workshop</label>
                <select id="workshop" name="workshop" onchange="calculateFee()" disabled>
                    <option value="Web Development">Web Development</option>
                    <option value="Artificial Intelligence">Artificial Intelligence</option>
                    <option value="Cyber Security">Cyber Security</option>
                </select>
            </div>

            <div class="field">
                <label class="check"><input type="checkbox" id="catering" name="catering" value="yes" onclick="toggleMeals()"> I would like catering</label>
            </div>

            <div class="field reveal" id="mealBox" hidden>
                <label for="meal">Meal option</label>
                <select id="meal" name="meal" onchange="calculateFee()" disabled>
                    <option value="lunch">Lunch every day (KSh 300 per day)</option>
                    <option value="none">No meals</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Submit registration</button>
        </form>

        <aside class="summary-card">
            <h2>Your fee</h2>
            <p id="packageMessage" class="package-msg">Pick a category to see your package.</p>
            <ul class="fee-list" id="feeBreakdown"></ul>
            <p id="discountNote" class="discount-note" hidden>5% final-year discount applied</p>
            <div class="total"><span>Total payable</span><strong id="totalFee">KSh 0</strong></div>
            <p class="small">PHP re-checks this amount when you submit.</p>
        </aside>
    </main>

    <footer class="site-footer">Student Technology and Innovation Conference 2026</footer>
    <script src="js/script.js"></script>
</body>
</html>
